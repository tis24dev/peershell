name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Build all (also typechecks every workspace)
        run: npm run build:all

      - name: Test
        run: npm test

      - name: Smoke
        run: npm run test:smoke

      - name: Version lockstep
        run: node scripts/check-version-lockstep.mjs

      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high || true
