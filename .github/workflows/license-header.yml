name: License Headers

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  headers:
    name: SPDX header check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check SPDX PolyForm-Noncommercial-1.0.0 headers on TS/JS/shell sources
        run: |
          missing=0
          while IFS= read -r f; do
            case "$f" in
              # third-party (MIT, (c) 2009 Kazuhiko Arase) — see NOTICE
              server/src/qrcode.js) continue ;;
            esac
            if ! grep -Iq 'SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0' "$f"; then
              echo "::error file=$f::missing SPDX PolyForm-Noncommercial-1.0.0 header"
              missing=1
            fi
          done < <(git ls-files '*.ts' '*.mjs' '*.cjs' '*.js' '*.sh' '*.html')
          exit $missing
